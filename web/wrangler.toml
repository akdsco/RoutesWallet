# Cloudflare Pages + Functions config for RoutesWallet web (TB-110).
# The static site still builds with Vite (`npm run build` → dist/); the Functions
# in ./functions add /api/routes and /connect/callback on the same origin.
name = "routeswallet"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# Public plaintext env vars — the Strava client id is public (it appears in the
# authorize URL), so it is safe to commit. Once wrangler.toml exists, Cloudflare
# Pages manages plaintext vars HERE, and the dashboard manages only the encrypted
# Secret (STRAVA_CLIENT_SECRET). STRAVA_CLIENT_ID is read by the Function at
# runtime; VITE_STRAVA_CLIENT_ID is baked into the frontend at build time.
[vars]
STRAVA_CLIENT_ID = "136750"
VITE_STRAVA_CLIENT_ID = "136750"
VITE_CARTO_BASEMAP_KEY = "cb1_2db4_1_49f5ab61d78bde2a4a5940f8"

# The shared route pool. The D1 database_id is a resource identifier, not a secret,
# so it is safe to commit — it binds `DB` for the deployed Pages Functions and for
# local `wrangler pages dev`. (Re)create + seed per docs/DEPLOYMENT.md §8a.
[[d1_databases]]
binding = "DB"
database_name = "routeswallet-db"
database_id = "10d6b848-5027-4ffb-ab10-db6fe4626942"

# The "Sign in with Strava" token bridge (TB-116): a KV namespace holding the
# ephemeral, single-use access token between the callback and /connect/sync. Create
# it (`npx wrangler kv namespace create SYNC`) and paste the returned id below, then
# uncomment — a placeholder id would fail deploy validation, so it stays commented
# until the real namespace exists (mirrors how the D1 id is only added once real).
# [[kv_namespaces]]
# binding = "SYNC"
# id = "<kv-namespace-id-from-wrangler-kv-namespace-create>"

# Secrets (NEVER commit) — set in the Pages dashboard: STRAVA_CLIENT_SECRET
# (server-only) + STRAVA_CLIENT_ID, VITE_STRAVA_CLIENT_ID as a build var, and
# SESSION_SECRET (TB-116 — the HMAC key signing the identity cookie).
